name: container_gradient_border
description: Flutter gradient border for any child via CustomPaint — linear, radial and sweep gradients, plus dashed, glow, and animated borders. Sizes to child.
version: 0.2.0
homepage: https://github.com/igloodev/container-gradient-border
repository: https://github.com/igloodev/container-gradient-border
issue_tracker: https://github.com/igloodev/container-gradient-border/issues

topics:
  - gradient
  - border
  - container
  - ui
  - decoration

screenshots:
  - description: 'LinearGradient card, RadialGradient avatar, SweepGradient pill button, multi-stop gradient input, and focus-state border'
    path: screenshots/example.jpg

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
